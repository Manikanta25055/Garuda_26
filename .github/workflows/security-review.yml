name: security review

# Claude reads each pull request's diff for security problems (injection,
# auth bypass, leaked secrets, unsafe deserialisation...) and comments on the
# lines it flags. Signs in with a Claude subscription: run `claude setup-token`
# once and save what it prints as the CLAUDE_CODE_OAUTH_TOKEN repository secret.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write  # to comment findings on the PR
  id-token: write       # the action exchanges this for its GitHub app token

jobs:
  claude:
    # Not hardened against prompt injection, and forks get no secrets anyway:
    # review only branches pushed to this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # v1, pinned to a commit so the reviewer cannot change under us.
      - uses: anthropics/claude-code-action@34968b5981d5d170904281aa3df6f3c0d4a28855
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Security-review this pull request's diff. The PR branch is checked
            out in the working directory. Drishti is a home security system
            on a Raspberry Pi: a FastAPI backend (basic_pipelines/), a web UI
            (drishti_web/), camera streams and an LLM agent that can act on
            the home. Look for real, exploitable problems only:
            - injection (command, SQL, path traversal, template, prompt
              injection reaching the agent's tools)
            - broken authentication, authorisation or session handling
            - XSS, CSRF, permissive CORS, unsafe headers
            - hardcoded secrets, secrets in logs, sensitive data exposure
            - unsafe deserialisation, eval, SSRF, weak crypto or randomness
            - deploy scripts that weaken the Pi (open ports, world-writable
              files, running as root without need)
            Skip style, denial of service, rate limiting and speculative
            issues with no concrete attack path.

            Put each finding as an inline comment on its line with
            mcp__github_inline_comment__create_inline_comment (confirmed:
            true), with severity (CRITICAL/HIGH/MEDIUM/LOW), the attack path
            and a fix. Then post one summary with `gh pr comment`; if nothing
            is found, say so in one line. Only post GitHub comments.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
