name: tests

# The suite mocks the camera, the Hailo runtime, GStreamer and every paid
# service, so it runs on a plain runner: no Pi, no keys.
on:
  push:
    branches: [main, Drishti]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # constraints.txt holds the framework versions the Pi runs.
          pip install -c constraints.txt numpy opencv-python-headless requests rapidfuzz anyio pydantic cryptography
          pip install -c constraints.txt -r requirements-test.txt
      - name: Byte-compile
        run: python -m compileall -q basic_pipelines scripts
      - name: Run tests
        run: python -m pytest tests -q
