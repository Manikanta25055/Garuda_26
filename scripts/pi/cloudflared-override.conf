# Drop-in for cloudflared.service (the named tunnel "garuda-api").
# Installed by scripts/pi/setup_boot.sh to
# /etc/systemd/system/cloudflared.service.d/override.conf.
# At boot DNS goes through Tailscale (100.100.100.100), which is not up yet, so
# the first starts fail; keep retrying instead of ever giving up.
[Unit]
After=tailscaled.service
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5s
