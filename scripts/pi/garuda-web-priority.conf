# Gives the Drishti web app first call on the Pi's CPU and disk.
# Installed by scripts/pi/setup_boot.sh to
# /etc/systemd/system/garuda-web.service.d/priority.conf.
# The memory limits are recorded for when the memory controller is on; the Pi
# kernel boots with cgroup_disable=memory, so today they are not enforced.
# IOWeight only takes effect with the bfq scheduler (sda uses mq-deadline).
[Service]
Nice=-10
CPUWeight=1000
IOWeight=1000
IOSchedulingClass=best-effort
IOSchedulingPriority=0
MemoryHigh=10G
MemoryMax=12G
