<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420">
  <!-- ── Background ── -->
  <rect width="580" height="420" fill="#F8F9FB"/>

  <!-- ── Hatch pattern for Balcony ── -->
  <defs>
    <pattern id="balcony-hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#C8D2DA" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- ═══════════ ROOM FILLS ═══════════ -->

  <!-- Living Room -->
  <rect x="8" y="218" width="564" height="194" fill="#F0F3F7" rx="0"/>

  <!-- Hallway -->
  <rect x="8" y="183" width="564" height="35" fill="#EAECF0" rx="0"/>

  <!-- Bedroom 1 -->
  <rect x="8" y="8" width="148" height="175" fill="#F3F0F8" rx="0"/>

  <!-- Bedroom 2 -->
  <rect x="156" y="8" width="148" height="175" fill="#F3F0F8" rx="0"/>

  <!-- Washroom -->
  <rect x="304" y="8" width="108" height="175" fill="#EEF5F6" rx="0"/>

  <!-- Kitchen -->
  <rect x="412" y="8" width="160" height="100" fill="#EEF5EF" rx="0"/>

  <!-- Balcony (hatched) -->
  <rect x="412" y="108" width="160" height="75" fill="url(#balcony-hatch)" rx="0"/>
  <rect x="412" y="108" width="160" height="75" fill="none" stroke="#C8D2DA" stroke-width="0.5"/>

  <!-- ═══════════ WALLS ═══════════ -->

  <!-- Outer boundary -->
  <rect x="8" y="8" width="564" height="404" fill="none" stroke="#8997A6" stroke-width="2.5"/>

  <!-- Interior: Bedroom 1 / Bedroom 2 divider -->
  <line x1="156" y1="8" x2="156" y2="183" stroke="#8997A6" stroke-width="1.8"/>

  <!-- Interior: Bedroom 2 / Washroom divider -->
  <line x1="304" y1="8" x2="304" y2="183" stroke="#8997A6" stroke-width="1.8"/>

  <!-- Interior: Washroom / Kitchen+Balcony divider -->
  <line x1="412" y1="8" x2="412" y2="218" stroke="#8997A6" stroke-width="1.8"/>

  <!-- Interior: Kitchen / Balcony horizontal divider -->
  <line x1="412" y1="108" x2="572" y2="108" stroke="#8997A6" stroke-width="1.8"/>

  <!-- Hallway top wall (below bedrooms/wash) -->
  <line x1="8" y1="183" x2="412" y2="183" stroke="#8997A6" stroke-width="1.8"/>

  <!-- Living room top wall -->
  <line x1="8" y1="218" x2="572" y2="218" stroke="#8997A6" stroke-width="1.8"/>

  <!-- ═══════════ DOOR OPENINGS & ARCS ═══════════ -->

  <!-- Main door (south wall of Living Room) – gap then arc -->
  <rect x="195" y="409" width="80" height="6" fill="#F8F9FB"/>
  <path d="M195,412 Q235,375 275,412" fill="none" stroke="#8997A6" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- Bedroom 1 door → Hallway -->
  <rect x="50" y="180" width="55" height="6" fill="#EAECF0"/>
  <path d="M50,183 Q77,205 105,183" fill="none" stroke="#8997A6" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Bedroom 2 door → Hallway -->
  <rect x="205" y="180" width="55" height="6" fill="#EAECF0"/>
  <path d="M205,183 Q232,205 260,183" fill="none" stroke="#8997A6" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Washroom door → Hallway -->
  <rect x="325" y="180" width="50" height="6" fill="#EAECF0"/>
  <path d="M325,183 Q350,202 375,183" fill="none" stroke="#8997A6" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Kitchen door → right portion of hallway/living area -->
  <rect x="409" y="148" width="6" height="45" fill="#F3F0F8"/>
  <path d="M412,148 Q430,170 412,193" fill="none" stroke="#8997A6" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Balcony access from kitchen bottom wall -->
  <rect x="455" y="105" width="55" height="6" fill="#EEF5EF"/>
  <path d="M455,108 Q482,125 510,108" fill="none" stroke="#8997A6" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- ═══════════ FURNITURE ═══════════ -->

  <!-- LIVING ROOM ── -->

  <!-- Sofa (center-ish, facing south toward main door) -->
  <rect x="145" y="340" width="185" height="52" fill="#CBD2DC" rx="8"/>
  <!-- Sofa armrests -->
  <rect x="145" y="340" width="18" height="52" fill="#B8BFC9" rx="5"/>
  <rect x="312" y="340" width="18" height="52" fill="#B8BFC9" rx="5"/>
  <!-- Sofa back cushions -->
  <rect x="163" y="340" width="50" height="18" fill="#BEC6D0" rx="4"/>
  <rect x="218" y="340" width="50" height="18" fill="#BEC6D0" rx="4"/>
  <rect x="273" y="340" width="39" height="18" fill="#BEC6D0" rx="4"/>

  <!-- Dining table (left side of Living Room) -->
  <rect x="18" y="250" width="88" height="62" fill="#CDD2DC" rx="5"/>
  <!-- Chairs around dining table -->
  <rect x="22" y="242" width="22" height="10" fill="#BAC0CB" rx="3"/>
  <rect x="49" y="242" width="22" height="10" fill="#BAC0CB" rx="3"/>
  <rect x="76" y="242" width="22" height="10" fill="#BAC0CB" rx="3"/>
  <rect x="22" y="311" width="22" height="10" fill="#BAC0CB" rx="3"/>
  <rect x="49" y="311" width="22" height="10" fill="#BAC0CB" rx="3"/>
  <rect x="76" y="311" width="22" height="10" fill="#BAC0CB" rx="3"/>

  <!-- Window on right wall of Living Room -->
  <rect x="563" y="270" width="9" height="70" fill="#A8CCE0" rx="2" opacity="0.8"/>
  <line x1="567" y1="270" x2="567" y2="340" stroke="#88AABC" stroke-width="0.8"/>
  <text x="556" y="266" font-family="'SF Pro', 'Helvetica Neue', sans-serif" font-size="7" fill="#8A9BAA" text-anchor="middle">win</text>

  <!-- BEDROOMS ── -->

  <!-- Bedroom 1 bed -->
  <rect x="16" y="30" width="118" height="80" fill="#D0CCE0" rx="6"/>
  <rect x="16" y="30" width="118" height="22" fill="#BEBAD0" rx="4"/>
  <!-- Pillows -->
  <rect x="20" y="32" width="50" height="14" fill="#D4D0E4" rx="3"/>
  <rect x="76" y="32" width="50" height="14" fill="#D4D0E4" rx="3"/>
  <!-- Bedside table -->
  <rect x="138" y="38" width="18" height="18" fill="#C4CAD4" rx="3"/>

  <!-- Bedroom 2 bed -->
  <rect x="164" y="30" width="118" height="80" fill="#D0CCE0" rx="6"/>
  <rect x="164" y="30" width="118" height="22" fill="#BEBAD0" rx="4"/>
  <rect x="168" y="32" width="50" height="14" fill="#D4D0E4" rx="3"/>
  <rect x="224" y="32" width="50" height="14" fill="#D4D0E4" rx="3"/>
  <rect x="286" y="38" width="18" height="18" fill="#C4CAD4" rx="3"/>

  <!-- WASHROOM fixtures ── -->
  <!-- Toilet -->
  <ellipse cx="347" cy="155" rx="22" ry="26" fill="#D8E4E8"/>
  <ellipse cx="347" cy="145" rx="13" ry="11" fill="#C8D8DC"/>
  <!-- Sink -->
  <rect x="312" y="13" width="32" height="30" fill="#D8E4E8" rx="5"/>
  <circle cx="328" cy="28" r="4" fill="#C0CDD0"/>
  <!-- Towel bar -->
  <rect x="310" y="90" width="4" height="40" fill="#CACFD4" rx="2"/>
  <line x1="312" y1="92" x2="312" y2="128" stroke="#B8BFC4" stroke-width="2.5"/>

  <!-- KITCHEN fixtures ── -->
  <!-- Counter top -->
  <rect x="416" y="12" width="156" height="26" fill="#BED8C8" rx="4"/>
  <!-- Right counter -->
  <rect x="548" y="38" width="24" height="66" fill="#BED8C8" rx="4"/>
  <!-- Stove circles -->
  <circle cx="462" cy="52" r="9" fill="#9EC4B0" stroke="#8AB4A0" stroke-width="0.8"/>
  <circle cx="488" cy="52" r="9" fill="#9EC4B0" stroke="#8AB4A0" stroke-width="0.8"/>
  <circle cx="462" cy="76" r="9" fill="#9EC4B0" stroke="#8AB4A0" stroke-width="0.8"/>

  <!-- ═══════════ ROOM LABELS ═══════════ -->

  <text x="82" y="112" text-anchor="middle" font-family="'SF Pro', 'Helvetica Neue', sans-serif" font-size="11.5" fill="#6B7280" font-weight="500">Bedroom 1</text>

  <text x="230" y="112" text-anchor="middle" font-family="'SF Pro', 'Helvetica Neue', sans-serif" font-size="11.5" fill="#6B7280" font-weight="500">Bedroom 2</text>

  <text x="358" y="112" text-anchor="middle" font-family="'SF Pro', 'Helvetica Neue', sans-serif" font-size="11.5" fill="#6B7280" font-weight="500">Washroom</text>

  <text x="492" y="62" text-anchor="middle" font-family="'SF Pro', 'Helvetica Neue', sans-serif" font-size="11" fill="#5E8068" font-weight="500">Kitchen</text>

  <text x="492" y="148" text-anchor="middle" font-family="'SF Pro', 'Helvetica Neue', sans-serif" font-size="10" fill="#8A9BAA" font-weight="400">Balcony</text>

  <text x="285" y="203" text-anchor="middle" font-family="'SF Pro', 'Helvetica Neue', sans-serif" font-size="9" fill="#8A9BAA" font-weight="400" letter-spacing="2.5">HALLWAY</text>

  <text x="285" y="296" text-anchor="middle" font-family="'SF Pro', 'Helvetica Neue', sans-serif" font-size="12" fill="#6B7280" font-weight="500">Living Room</text>

  <!-- MAIN DOOR label -->
  <text x="235" y="422" text-anchor="middle" font-family="'SF Pro', 'Helvetica Neue', sans-serif" font-size="8" fill="#8A9BAA">MAIN DOOR</text>

  <!-- Compass (small, top-right corner) -->
  <text x="565" y="20" text-anchor="middle" font-family="'SF Pro', sans-serif" font-size="10" fill="#9CA3AF">N</text>
  <line x1="565" y1="22" x2="565" y2="30" stroke="#9CA3AF" stroke-width="1.2"/>
  <polygon points="565,22 562,28 565,26 568,28" fill="#9CA3AF"/>

</svg>
